<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ground { fill: #efe9dd; }
    .warp { fill: #24456e; }
    .weft { fill: #b9ae95; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #191a1d; }
      .warp { fill: #8fb0e0; }
      .weft { fill: #5e5a50; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="4" />
  <rect class="warp" x="4" y="4" width="8" height="8" />
  <rect class="weft" x="12" y="4" width="8" height="8" />
  <rect class="warp" x="20" y="4" width="8" height="8" />
  <rect class="weft" x="4" y="12" width="8" height="8" />
  <rect class="warp" x="12" y="12" width="8" height="8" />
  <rect class="weft" x="20" y="12" width="8" height="8" />
  <rect class="warp" x="4" y="20" width="8" height="8" />
  <rect class="weft" x="12" y="20" width="8" height="8" />
  <rect class="warp" x="20" y="20" width="8" height="8" />
</svg>
